<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account settings — Authly</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://rsms.me/inter/inter.css');body{font-family:'Inter',sans-serif}</style>
<script>
  (function() {
    var token = localStorage.getItem('authly_token');
    var expiry = localStorage.getItem('authly_expiry');
    if (!token || !expiry || Date.now() > +expiry) {
      localStorage.removeItem('authly_token');
      localStorage.removeItem('authly_expiry');
      localStorage.removeItem('authly_user');
      sessionStorage.setItem('authly_redirect', location.pathname);
      location.replace('../variant-1-split-screen/login.html');
    }
  })();
</script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

<header class="bg-white border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="dashboard.html" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center"><svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <span class="font-bold text-xl">Authly</span>
    </a>
    <img src="https://i.pravatar.cc/40?img=12" class="w-9 h-9 rounded-full" />
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-12 space-y-6">
  <h1 class="text-3xl font-bold mb-2">Account settings</h1>

  <section class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="font-semibold mb-4">Profile</h2>
    <div class="space-y-4">
      <div><label class="block text-sm font-medium mb-1.5">Name</label><input type="text" value="Paulo Brito" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none"/></div>
      <div><label class="block text-sm font-medium mb-1.5">Email</label><input type="email" value="paulo@example.com" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none"/></div>
      <button class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">Save changes</button>
    </div>
  </section>

  <section class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="font-semibold mb-4">Password</h2>
    <a href="../variant-1-split-screen/reset-password.html" class="inline-flex px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-sm font-medium">Change password</a>
  </section>

  <section class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="font-semibold mb-4">Two-factor authentication</h2>
    <p class="text-sm text-gray-600 mb-4">Add an extra layer of security to your account.</p>
    <button class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">Enable 2FA</button>
  </section>

  <section class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="font-semibold mb-4">Active sessions</h2>
    <div class="space-y-3">
      <div class="flex items-center justify-between p-3 rounded-lg bg-gray-50">
        <div><div class="font-medium text-sm">MacBook Pro · Chrome</div><div class="text-xs text-gray-500">Lisbon, Portugal · Active now</div></div>
        <span class="text-xs text-emerald-600 font-medium">Current</span>
      </div>
      <div class="flex items-center justify-between p-3 rounded-lg bg-gray-50">
        <div><div class="font-medium text-sm">iPhone · Safari</div><div class="text-xs text-gray-500">Lisbon, Portugal · 2 hours ago</div></div>
        <button class="text-xs text-red-600 hover:underline font-medium">Revoke</button>
      </div>
    </div>
  </section>

  <section class="bg-white
