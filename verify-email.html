<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify email</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://rsms.me/inter/inter.css');body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-white text-gray-900">
<div class="min-h-screen grid lg:grid-cols-2">
  <div class="hidden lg:flex bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 text-white p-12 flex-col justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-white/20 backdrop-blur flex items-center justify-center"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <span class="font-bold text-xl">Authly</span>
    </div>
    <div>
      <h2 class="text-4xl font-bold mb-4 leading-tight">Almost there.<br/>One last step.</h2>
      <p class="text-white/80">Email verification keeps your account secure and helps prevent spam.</p>
    </div>
    <div class="text-sm text-white/70">© 2026 Authly Inc.</div>
  </div>

  <div class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm text-center">
      <div class="inline-flex w-16 h-16 rounded-full bg-indigo-100 items-center justify-center mb-6">
        <svg class="w-8 h-8 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <h1 class="text-3xl font-bold mb-2">Verify your email</h1>
      <p class="text-gray-600 mb-2">We sent a 6-digit code to</p>
      <p class="font-medium text-gray-900 mb-8">paulo@example.com</p>
      <div class="flex justify-center gap-2 mb-6" id="codeInputs">
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code-input w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
      </div>
      <button id="verify" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition mb-4 disabled:opacity-50" disabled>Verify email</button>
      <p class="text-sm text-gray-600">Didn't receive the code? <button id="resend" class="text-indigo-600 hover:underline font-medium">Resend (60s)</button></p>
    </div>
  </div>
</div>
<script>
  const inputs=document.querySelectorAll('.code-input'),btn=document.getElementById('verify');
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',e=>{
      e.target.value=e.target.value.replace(/\D/g,'');
      if(e.target.value&&i<inputs.length-1)inputs[i+1].focus();
      btn.disabled=Array.from(inputs).some(x=>!x.value);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus()});
    inp.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text').slice(0,6);[...t].forEach((ch,j)=>{if(inputs[j])inputs[j].value=ch});inputs[Math.min(t.length,5)].focus();btn.disabled=Array.from(inputs).some(x=>!x.value)});
  });
  btn.onclick=()=>window.location.href='../protected/dashboard.html';
  let s=60;const r=document.getElementById('resend');
  const t=setInterval(()=>{s--;r.textContent=s>0?`Resend (${s}s)`:'Resend';if(s<=0){clearInterval(t);r.disabled=false}else r.disabled=true},1000);
</script>
</body>
</html>
