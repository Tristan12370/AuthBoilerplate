<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Auth Boilerplate</title>
  <link rel="stylesheet" href="../auth.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="flex h-screen bg-white">
    <!-- Left Brand Panel -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-green-600 to-green-800 flex-col items-center justify-center p-12">
      <div class="text-center max-w-md">
        <div class="mb-8">
          <svg class="w-16 h-16 mx-auto text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
          </svg>
        </div>
        <h2 class="text-4xl font-bold text-white mb-4">Get Started</h2>
        <p class="text-green-100 text-lg mb-8">
          Join thousands of users enjoying secure, modern authentication with our premium auth system.
        </p>
        <div class="space-y-4">
          <div class="flex items-center text-white">
            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            Strong Password Requirements
          </div>
          <div class="flex items-center text-white">
            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            Real-time Validation
          </div>
          <div class="flex items-center text-white">
            <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            Email Verification
          </div>
        </div>
      </div>
    </div>

    <!-- Right Registration Form -->
    <div class="w-full lg:w-1/2 flex flex-col items-center justify-center p-6 sm:p-12 overflow-y-auto">
      <div class="w-full max-w-md">
        <div class="form-header">
          <h1>Create Account</h1>
          <p>Join our community today</p>
        </div>

        <form id="registerForm" class="space-y-5">
          <div class="form-field" data-field-wrapper>
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="John Doe"
              required
              class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-colors"
            >
            <span class="error-message" data-error-message></span>
          </div>

          <div class="form-field" data-field-wrapper>
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
              class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-colors"
            >
            <span class="error-message" data-error-message></span>
          </div>

          <div class="form-field form-field-with-icon" data-field-wrapper>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              required
              class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-colors"
            >
            <button type="button" class="form-field-icon" id="passwordToggle">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
            <div class="password-strength-meter">
              <div class="password-strength-meter-bar" id="strengthBar"></div>
            </div>
            <div class="password-strength-label" id="strengthLabel">Too Weak</div>
            <span class="error-message" data-error-message></span>
          </div>

          <div class="form-field" data-field-wrapper>
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
              class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:ring-2 focus:ring-green-100 transition-colors"
            >
            <span class="error-message" data-error-message></span>
          </div>

          <label class="checkbox-wrapper cursor-pointer text-sm">
            <input type="checkbox" name="terms" required class="hidden">
            <span class="checkbox-custom flex-shrink-0"></span>
            <span>I agree to the <a href="#" class="text-green-600 hover:text-green-700 font-medium">Terms of Service</a> and <a href="#" class="text-green-600 hover:text-green-700 font-medium">Privacy Policy</a></span>
          </label>

          <button type="submit" class="btn btn-primary btn-full-width btn-lg mt-6" style="background-color: #16a34a;">
            Create Account
          </button>
        </form>

        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">Or sign up with</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="social-btn flex items-center justify-center gap-2 p-3 border-2 border-gray-300 rounded-lg hover:border-green-500 hover:bg-green-50 transition-colors" data-provider="Google">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span class="hidden sm:inline text-sm font-medium">Google</span>
          </button>

          <button type="button" class="social-btn flex items-center justify-center gap-2 p-3 border-2 border-gray-300 rounded-lg hover:border-gray-800 hover:bg-gray-100 transition-colors" data-provider="GitHub">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            <span class="hidden sm:inline text-sm font-medium">GitHub</span>
          </button>
        </div>

        <p class="form-footer">
          Already have an account? <a href="login.html" class="text-green-600 font-semibold">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../auth.js"></script>
  <script>
    const registerForm = document.getElementById('registerForm');
    const validator = new FormValidator('#registerForm');
    const passwordMeter = new PasswordStrengthMeter('#password', '#strengthBar', '#strengthLabel');

    setupPasswordToggle('#passwordToggle', '#password');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!validator.validateForm()) {
        NotificationManager.error('Please fix the errors above');
        return;
      }

      const formData = validator.getFormData();
      const loadingState = new LoadingState('button[type="submit"]');

      loadingState.start();

      try {
        const result = await auth.simulateRegister(formData.email, formData.password);

        if (result.success) {
          NotificationManager.success('Account created! Redirecting...');
          setTimeout(() => {
            window.location.href = 'verify-email.html';
          }, 800);
        }
      } catch (error) {
        NotificationManager.error('Registration failed. Please try again.');
      } finally {
        loadingState.stop();
      }
    });

    // Social signup handlers
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        const provider = btn.dataset.provider;
        const loadingState = new LoadingState(btn);

        loadingState.start();

        try {
          await handleSocialLogin(provider);
          NotificationManager.success('Account created successfully!');
          setTimeout(() => {
            window.location.href = '../protected/dashboard.html';
          }, 800);
        } catch (error) {
          NotificationManager.error(`${provider} signup failed`);
        } finally {
          loadingState.stop();
        }
      });
    });
  </script>
</body>
</html>
