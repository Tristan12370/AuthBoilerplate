<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Authly</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://rsms.me/inter/inter.css');body{font-family:'Inter',sans-serif}</style>
<script>
  // Auth guard — must run before page render. Redirect if no valid token.
  (function() {
    var token = localStorage.getItem('authly_token');
    var expiry = localStorage.getItem('authly_expiry');
    if (!token || !expiry || Date.now() > +expiry) {
      localStorage.removeItem('authly_token');
      localStorage.removeItem('authly_expiry');
      localStorage.removeItem('authly_user');
      sessionStorage.setItem('authly_redirect', location.pathname);
      location.replace('../variant-1-split-screen/login.html');
    }
  })();
</script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

<header class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center"><svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <span class="font-bold text-xl">Authly</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="account.html" class="text-sm text-gray-600 hover:text-gray-900">Account</a>
      <button id="logoutBtn" class="px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-sm font-medium">Sign out</button>
      <img src="https://i.pravatar.cc/40?img=12" class="w-9 h-9 rounded-full" />
      <span id="userName" class="text-sm text-gray-600 hidden sm:inline"></span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-12">
  <div class="bg-white rounded-2xl border border-gray-200 p-12 text-center">
    <div class="inline-flex w-16 h-16 rounded-full bg-emerald-100 items-center justify-center mb-6">
      <svg class="w-8 h-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="text-3xl font-bold mb-2">Welcome, <span id="welcomeName">there</span>
