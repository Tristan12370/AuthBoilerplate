<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two-factor authentication</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://rsms.me/inter/inter.css');body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-white text-gray-900">
<div class="min-h-screen grid lg:grid-cols-2">
  <div class="hidden lg:flex bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 text-white p-12 flex-col justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-white/20 backdrop-blur flex items-center justify-center"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <span class="font-bold text-xl">Authly</span>
    </div>
    <div>
      <h2 class="text-4xl font-bold mb-4 leading-tight">Extra security.<br/>Zero friction.</h2>
      <p class="text-white/80">Two-factor authentication adds a critical layer of protection to your account.</p>
    </div>
    <div class="text-sm text-white/70">© 2026 Authly Inc.</div>
  </div>

  <div class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm text-center">
      <div class="inline-flex w-16 h-16 rounded-full bg-indigo-100 items-center justify-center mb-6">
        <svg class="w-8 h-8 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <h1 class="text-3xl font-bold mb-2">Two-factor authentication</h1>
      <p class="text-gray-600 mb-8">Enter the 6-digit code from your authenticator app</p>
      <div class="flex justify-center gap-2 mb-6">
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
        <input type="text" maxlength="1" class="code w-12 h-14 text-center text-xl font-bold rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
      </div>
      <button id="verify" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition disabled:opacity-50" disabled>Verify</button>
      <button class="mt-4 text-sm text-indigo-600 hover:underline">Use a recovery code instead</button>
    </div>
  </div>
</div>
<script>
  const inputs=document.querySelectorAll('.code'),btn=document.getElementById('verify');
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input',e=>{
      e.target.value=e.target.value.replace(/\D/g,'');
      if(e.target.value&&i<inputs.length-1)inputs[i+1].focus();
      btn.disabled=Array.from(inputs).some(x=>!x.value);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus()});
  });
  btn.onclick=()=>window.location.href='../protected/dashboard.html';
</script>
</body>
</html>
