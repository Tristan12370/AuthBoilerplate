<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://rsms.me/inter/inter.css');body{font-family:'Inter',sans-serif}</style>
</head>
<body class="min-h-screen bg-white text-gray-900">
<div class="min-h-screen grid lg:grid-cols-2">
  <div class="hidden lg:flex bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 text-white p-12 flex-col justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-white/20 backdrop-blur flex items-center justify-center"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
      <span class="font-bold text-xl">Authly</span>
    </div>
    <div>
      <h2 class="text-4xl font-bold mb-4 leading-tight">Choose a strong<br/>new password.</h2>
      <p class="text-white/80">Use at least 8 characters with a mix of uppercase, lowercase, numbers, and symbols.</p>
    </div>
    <div class="text-sm text-white/70">© 2026 Authly Inc.</div>
  </div>

  <div class="flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">
      <h1 class="text-3xl font-bold mb-2">Reset your password</h1>
      <p class="text-gray-600 mb-8">Enter a new password for paulo@example.com</p>
      <form id="form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">New password</label>
          <div class="relative">
            <input type="password" id="pw" required minlength="8" class="w-full px-3.5 py-2.5 pr-10 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
            <button type="button" id="toggle" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="mt-2 flex gap-1">
            <div class="flex-1 h-1 rounded bg-gray-200" id="b1"></div><div class="flex-1 h-1 rounded bg-gray-200" id="b2"></div><div class="flex-1 h-1 rounded bg-gray-200" id="b3"></div><div class="flex-1 h-1 rounded bg-gray-200" id="b4"></div>
          </div>
          <p class="text-xs text-gray-500 mt-1.5" id="hint">At least 8 characters</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Confirm password</label>
          <input type="password" id="cpw" required class="w-full px-3.5 py-2.5 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none" />
          <p id="match" class="text-xs text-red-500 mt-1.5 hidden">Passwords don't match</p>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">Reset password</button>
      </form>
    </div>
  </div>
</div>
<script>
  const pw=document.getElementById('pw'),cpw=document.getElementById('cpw');
  document.getElementById('toggle').onclick=()=>pw.type=pw.type==='password'?'text':'password';
  pw.addEventListener('input',()=>{
    const v=pw.value;let s=0;
    if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
    const c=['bg-red-500','bg-orange-500','bg-yellow-500','bg-emerald-500'],l=['Weak','Fair','Good','Strong'];
    [1,2,3,4].forEach(i=>{document.getElementById('b'+i).className='flex-1 h-1 rounded '+(i<=s?c[s-1]:'bg-gray-200')});
    document.getElementById('hint').textContent=v.length===0?'At least 8 characters':l[s-1]||'Too short';
  });
  cpw.addEventListener('input',()=>{document.getElementById('match').classList.toggle('hidden',cpw.value===''||cpw.value===pw.value)});
  document.getElementById('form').addEventListener('submit',e=>{
    e.preventDefault();
    if(pw.value!==cpw.value){document.getElementById('match').classList.remove('hidden');return}
    window.location.href='../protected/dashboard.html';
  });
</script>
</body>
</html>
